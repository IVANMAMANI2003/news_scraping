<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug BizNews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/global.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug BizNews</h1>
        <div id="debug-info" class="alert alert-info">
            <h4>🔍 Verificando componentes...</h4>
            <div id="debug-results"></div>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <h3>Noticia Destacada</h3>
                <div id="featured-news">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p class="loading-text">Cargando noticia destacada...</p>
                    </div>
                </div>
                
                <h3>Últimas Noticias</h3>
                <div id="latest-news">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p class="loading-text">Cargando últimas noticias...</p>
                    </div>
                </div>
                
                <h3>Noticias de Puno</h3>
                <div id="small-news-container">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p class="loading-text">Cargando noticias de Puno...</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <h3>Trending</h3>
                <div id="trending-news">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p class="loading-text">Cargando...</p>
                    </div>
                </div>
                
                <h3>Categorías</h3>
                <div id="popular-categories">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p class="loading-text">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Debug script
        function debugInfo(message) {
            const debugResults = document.getElementById('debug-results');
            debugResults.innerHTML += `<p>${message}</p>`;
            console.log(message);
        }

        async function testAPI() {
            debugInfo('🚀 Iniciando test de API...');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/news');
                const data = await response.json();
                
                debugInfo(`✅ API funcionando - Total: ${data.total} noticias`);
                
                const news = data.items || [];
                debugInfo(`📰 Noticias en items: ${news.length}`);
                
                if (news.length > 0) {
                    debugInfo(`📝 Primera noticia: ${news[0].titulo}`);
                    debugInfo(`🏷️ Categoría: ${news[0].categoria}`);
                    debugInfo(`📡 Fuente: ${news[0].fuente}`);
                }
                
                return news;
            } catch (error) {
                debugInfo(`❌ Error API: ${error.message}`);
                return [];
            }
        }

        function renderNews(news) {
            debugInfo('🎨 Renderizando noticias...');
            
            // Noticia destacada
            const featuredContainer = document.getElementById('featured-news');
            if (featuredContainer && news.length > 0) {
                const featured = news[0];
                featuredContainer.innerHTML = `
                    <div class="news-card">
                        <img class="news-image" src="${featured.imagen_principal || 'img/news-700x435-1.jpg'}" 
                             style="width: 100%; height: 200px; object-fit: cover;">
                        <div class="news-content">
                            <div class="news-category">${featured.categoria || 'General'}</div>
                            <h2 class="news-title">${featured.titulo || 'Sin título'}</h2>
                            <p class="news-summary">${featured.resumen || 'Sin resumen'}</p>
                            <div class="news-meta">
                                <span>${featured.fuente || 'BizNews'}</span>
                            </div>
                        </div>
                    </div>
                `;
                debugInfo('✅ Noticia destacada renderizada');
            }
            
            // Últimas noticias
            const latestContainer = document.getElementById('latest-news');
            if (latestContainer) {
                const latestNews = news.slice(0, 6);
                const cards = latestNews.map(n => `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card">
                            <img src="${n.imagen_principal || 'img/news-700x435-1.jpg'}" 
                                 class="card-img-top" style="height: 150px; object-fit: cover;">
                            <div class="card-body">
                                <h6 class="card-title">${n.titulo || 'Sin título'}</h6>
                                <p class="card-text small">${(n.resumen || '').substring(0, 100)}...</p>
                                <small class="text-muted">${n.fuente || 'BizNews'}</small>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                latestContainer.innerHTML = `<div class="row">${cards}</div>`;
                debugInfo('✅ Últimas noticias renderizadas');
            }
            
            // Noticias de Puno
            const punoContainer = document.getElementById('small-news-container');
            if (punoContainer) {
                const punoNews = news.filter(n => 
                    n.categoria === 'Puno' || 
                    (n.titulo && n.titulo.toLowerCase().includes('puno'))
                );
                
                const selectedNews = punoNews.length > 0 ? punoNews.slice(0, 4) : news.slice(0, 4);
                const cards = selectedNews.map(n => `
                    <div class="small-news-card mb-3">
                        <img src="${n.imagen_principal || 'img/news-700x435-1.jpg'}" 
                             style="width: 80px; height: 80px; object-fit: cover; float: left; margin-right: 10px;">
                        <div>
                            <h6>${n.titulo || 'Sin título'}</h6>
                            <small class="text-muted">${n.fuente || 'BizNews'}</small>
                        </div>
                    </div>
                `).join('');
                
                punoContainer.innerHTML = cards;
                debugInfo('✅ Noticias de Puno renderizadas');
            }
            
            // Trending
            const trendingContainer = document.getElementById('trending-news');
            if (trendingContainer) {
                const trendingNews = news.slice(0, 5);
                const cards = trendingNews.map(n => `
                    <div class="small-news-card mb-3">
                        <img src="${n.imagen_principal || 'img/news-700x435-1.jpg'}" 
                             style="width: 80px; height: 80px; object-fit: cover; float: left; margin-right: 10px;">
                        <div>
                            <h6>${n.titulo || 'Sin título'}</h6>
                            <small class="text-muted">${n.fuente || 'BizNews'}</small>
                        </div>
                    </div>
                `).join('');
                
                trendingContainer.innerHTML = cards;
                debugInfo('✅ Trending renderizado');
            }
            
            // Categorías
            const categoriesContainer = document.getElementById('popular-categories');
            if (categoriesContainer) {
                const categories = {};
                news.forEach(n => {
                    const cat = n.categoria || 'General';
                    categories[cat] = (categories[cat] || 0) + 1;
                });
                
                const sortedCategories = Object.entries(categories)
                    .sort(([,a], [,b]) => b - a)
                    .slice(0, 6);
                
                const categoryCards = sortedCategories.map(([category, count]) => `
                    <div class="category-card mb-2 p-2 border rounded">
                        <strong>${category}</strong> - ${count} noticias
                    </div>
                `).join('');
                
                categoriesContainer.innerHTML = categoryCards;
                debugInfo('✅ Categorías renderizadas');
            }
        }

        // Ejecutar cuando se carga la página
        document.addEventListener('DOMContentLoaded', async () => {
            debugInfo('📄 DOM cargado');
            const news = await testAPI();
            if (news.length > 0) {
                renderNews(news);
                debugInfo('🎉 ¡Todo funcionando correctamente!');
            } else {
                debugInfo('⚠️ No se pudieron cargar las noticias');
            }
        });
    </script>
</body>
</html>
