version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: noticias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOCKER_ENV: "1"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: noticias
      PGUSER: postgres
      PGPASSWORD: 123456
      FRONTEND_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  scheduler:
    build: .
    environment:
      DOCKER_ENV: "1"
      RUN_ON_START: "1"
      API_URL: http://api:8000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: noticias
      PGUSER: postgres
      PGPASSWORD: 123456
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_started
    command: ["python", "scheduler_daily.py"]

volumes:
  pgdata:


