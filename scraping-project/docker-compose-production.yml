version: '3.8'

services:
  # PostgreSQL - Base de datos principal
  postgres:
    image: postgres:15-alpine
    container_name: news_postgres_prod
    environment:
      POSTGRES_DB: noticias
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup_database.py:/docker-entrypoint-initdb.d/setup_database.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noticias"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Broker de tareas
  redis:
    image: redis:7-alpine
    container_name: news_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Sistema completo - Worker, Beat y API
  news_system:
    build: .
    container_name: news_system_complete
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://postgres:123456@postgres:5432/noticias
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_NAME=noticias
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_PORT=5432
      - DOCKER_ENV=true
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=noticias
      - PGUSER=postgres
      - PGPASSWORD=123456
    command: python start_docker_simple.py
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
